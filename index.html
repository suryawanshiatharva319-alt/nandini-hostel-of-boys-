<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nandini Boys Hostel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body{font-family:Inter,Arial,sans-serif}
    .gold{background:linear-gradient(135deg,#facc15,#d97706)}
    .navy{background:#0f172a}
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div class="gold text-slate-950 text-center text-sm font-semibold py-2">
    ⚡Admissions open - rooms from ₹2,000/month
  </div>

  <main id="top">
    <!-- Rating Section -->
    <section id="rating" class="py-12 bg-white text-center">
      <div class="max-w-md mx-auto px-4">
        <h2 class="text-2xl font-bold text-slate-800 mb-2">Rate Our Hostel</h2>
        
        <div class="mb-4">
          <span id="avg-rating" class="text-3xl font-bold text-amber-500">0.0</span>
          <span class="text-xl text-amber-400">★</span>
          <p id="total-votes" class="text-sm text-slate-500 mt-1">Loading reviews...</p>
        </div>

        <div id="star-container" class="flex justify-center space-x-2 text-4xl mb-3">
          <button onclick="submitRating(1)" class="star-btn text-gray-300 hover:text-amber-400 transition">★</button>
          <button onclick="submitRating(2)" class="star-btn text-gray-300 hover:text-amber-400 transition">★</button>
          <button onclick="submitRating(3)" class="star-btn text-gray-300 hover:text-amber-400 transition">★</button>
          <button onclick="submitRating(4)" class="star-btn text-gray-300 hover:text-amber-400 transition">★</button>
          <button onclick="submitRating(5)" class="star-btn text-gray-300 hover:text-amber-400 transition">★</button>
        </div>

        <p id="rating-result" class="text-amber-600 font-semibold h-6"></p>
      </div>
    </section>

    <script>
      const SCRIPT_URL = "PASTE_YOUR_COPIED_URL_HERE";

      function fetchRatings() {
        if (SCRIPT_URL === "PASTE_YOUR_COPIED_URL_HERE") return;
        fetch(SCRIPT_URL)
          .then(res => res.json())
          .then(data => {
            document.getElementById('avg-rating').innerText = data.average;
            document.getElementById('total-votes').innerText = `Based on ${data.totalVotes} total review(s)`;
          });
      }

      function submitRating(stars) {
        const starBtns = document.querySelectorAll('#star-container .star-btn');
        starBtns.forEach((btn, index) => {
          if (index < stars) {
            btn.classList.remove('text-gray-300');
            btn.classList.add('text-amber-400');
          } else {
            btn.classList.remove('text-amber-400');
            btn.classList.add('text-gray-300');
          }
        });

        document.getElementById('rating-result').innerText = 'Submitting your vote...';

        fetch(`${SCRIPT_URL}?action=rate&rating=${stars}`)
          .then(res => res.json())
          .then(data => {
            document.getElementById('avg-rating').innerText = data.average;
            document.getElementById('total-votes').innerText = `Based on ${data.totalVotes} total review(s)`;
            document.getElementById('rating-result').innerText = 'Thank you for your rating!';
          });
      }

      fetchRatings();
    </script>
  </main>
</body>
</html>
